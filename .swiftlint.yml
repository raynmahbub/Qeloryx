# QELORYX — SwiftLint Configuration
# Premium codebase — strict linting

disabled_rules:
  - trailing_whitespace

opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - force_unwrapping
  - implicit_return
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

excluded:
  - .build
  - DerivedData
  - Pods
  - Tests

line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 50
  error: 100

cyclomatic_complexity:
  warning: 10
  error: 20

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 40
    error: 50
  excluded:
    - id
    - x
    - y

custom_rules:
  no_direct_avfoundation_in_features:
    name: "No direct AVFoundation in Features"
    regex: "import AVFoundation"
    message: "AVFoundation must be isolated in Platform layer"
    severity: warning
    included:
      - 'Features/.*\.swift'
  
  no_swiftui_in_domain:
    name: "No SwiftUI in Domain/Core"
    regex: "import SwiftUI"
    message: "SwiftUI must stay in Presentation layer only"
    severity: error
    included:
      - 'Core/.*\.swift'

  astrix_prefix:
    name: "Astryx prefix for components"
    regex: "struct (?!Astryx)[A-Z].*View:"
    message: "Reusable components should begin with Astryx"
    severity: warning
    included:
      - 'DesignSystem/Components/.*\.swift'
