name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tagged source
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select supported Xcode toolchain
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '16.4'
      - name: Validate tag format
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
      - name: Build Swift package
        run: swift build -c release
      - name: Test Swift package
        run: swift test -c release
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned simulator app
        run: |
          set -o pipefail
          xcodebuild -project Qeloryx.xcodeproj -scheme Qeloryx \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package app
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/Qeloryx.app"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Qeloryx-simulator.zip
      - uses: actions/upload-artifact@v6
        with:
          name: release-simulator-app
          path: Qeloryx-simulator.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub prerelease/release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-simulator-app
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == *-* ]]; then
            PRERELEASE=(--prerelease)
          else
            PRERELEASE=()
          fi
          gh release create "$RELEASE_TAG" Qeloryx-simulator.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Qeloryx ${RELEASE_TAG#v}" \
            --generate-notes \
            "${PRERELEASE[@]}"
