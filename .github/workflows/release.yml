name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag and build release assets
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select supported Xcode toolchain
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '16.4'
      - name: Validate tag format
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
      - name: Build Swift package
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tee swift-build-release.log
      - name: Test Swift package
        run: |
          set -o pipefail
          swift test -c release 2>&1 | tee swift-test-release.log
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned simulator app
        run: |
          set -o pipefail
          xcodebuild -project Qeloryx.xcodeproj -scheme Qeloryx \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild-simulator.log
      - name: Package app
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/Qeloryx.app"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Qeloryx-simulator.zip
      - uses: actions/upload-artifact@v6
        with:
          name: release-simulator-app
          path: Qeloryx-simulator.zip
          if-no-files-found: error
          retention-days: 1
      - name: Build unsigned device app (arm64)
        run: |
          set -o pipefail
          xcodebuild -project Qeloryx.xcodeproj -scheme Qeloryx \
            -destination 'generic/platform=iOS' \
            -configuration Release -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild-device.log
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Qeloryx.app"
          test -d "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc Payload Qeloryx.ipa
          rm -rf Payload
      - uses: actions/upload-artifact@v6
        with:
          name: release-ipa
          path: Qeloryx.ipa
          if-no-files-found: error
          retention-days: 1
      - name: Surface build errors in check annotations
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          matches = []
          seen = set()
          for log in Path(".").glob("*.log"):
              for line in log.read_text(errors="replace").splitlines():
                  if re.search(r"\berror:", line, re.IGNORECASE):
                      entry = f"{log.name}: {line.strip()}"
                      if entry not in seen:
                          seen.add(entry)
                          matches.append(entry)
          for line in matches[:40]:
              escaped = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Release build diagnostic::{escaped}")
          if not matches:
              print("::error title=Release build failed::No error line was captured; inspect the uploaded release diagnostics artifact.")
          PY
      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-diagnostics-${{ github.sha }}
          path: "*.log"
          if-no-files-found: ignore
          retention-days: 5

  publish:
    name: Publish GitHub prerelease/release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-simulator-app
      - uses: actions/download-artifact@v7
        with:
          name: release-ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == *-* ]]; then
            PRERELEASE=(--prerelease)
          else
            PRERELEASE=()
          fi
          gh release create "$RELEASE_TAG" Qeloryx.ipa Qeloryx-simulator.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Qeloryx ${RELEASE_TAG#v}" \
            --generate-notes \
            "${PRERELEASE[@]}"
