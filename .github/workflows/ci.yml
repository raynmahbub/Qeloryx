name: CI

on:
  push:
    branches: [ main, arena/*, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: --strict

  test-core:
    name: Core Tests (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'
      
      - name: Swift Version
        run: swift --version
      
      - name: Build Core
        run: swift build --target QeloryxCore
      
      - name: Run Core Tests
        run: swift test --filter QeloryxCoreTests
      
      - name: Run DesignSystem Tests
        run: swift test --filter QeloryxDesignSystemTests

  build-ios:
    name: iOS Build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'
      
      - name: Check project structure
        run: |
          ls -la App/
          ls -la Core/
          ls -la DesignSystem/
          ls -la Docs/ACC/
      
      - name: Validate ACC
        run: |
          cat Docs/ACC/ACC.md
          echo "ACC exists — foundation milestone check"
      
      - name: Build (if Xcode project exists)
        run: |
          if [ -f "project.yml" ]; then
            echo "XcodeGen spec found, would generate project"
            # brew install xcodegen
            # xcodegen generate
          fi
          if [ -d "Qeloryx.xcodeproj" ]; then
            xcodebuild -project Qeloryx.xcodeproj -scheme Qeloryx -destination 'platform=iOS Simulator,name=iPhone 15' build | xcpretty
          else
            echo "No Xcode project yet — foundation uses SPM, skipping xcodebuild"
          fi

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Docs
        run: |
          echo "Checking engineering docs..."
          ls -la Docs/ADR/
          ls -la Docs/EPL/
          ls -la Docs/IL/
          ls -la Docs/SHM/
          ls -la Docs/ACC/
          test -f Docs/ACC/ACC.md || (echo "ACC missing" && exit 1)
          test -f Docs/ACC/AGENT_STATE.md || (echo "AGENT_STATE missing" && exit 1)
          echo "Docs OK"
