name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'release/**', 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-package:
    name: Swift package build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select supported Xcode toolchain
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '16.4'
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: |
          set -o pipefail
          swift build -v 2>&1 | tee swift-build.log
      # Test classes run one step each with their own step-level timeouts —
      # the whole suite in a single `swift test` invocation has wedged more
      # than once without naming the hanging test (piped XCTest output is
      # block-buffered, so a hard kill loses the tail). This mirrors the
      # Release workflow's fan-out.
      - name: Test AstryxAudioEngineTests
        timeout-minutes: 6
        run: |
          set -o pipefail
          swift test -c release --filter AstryxAudioEngineTests 2>&1 | tee test-AstryxAudioEngineTests.log
      - name: Test AstryxColorsTests
        timeout-minutes: 6
        run: |
          set -o pipefail
          swift test -c release --filter AstryxColorsTests 2>&1 | tee test-AstryxColorsTests.log
      - name: Test CapabilityRegistryTests
        timeout-minutes: 6
        run: |
          set -o pipefail
          swift test -c release --filter CapabilityRegistryTests 2>&1 | tee test-CapabilityRegistryTests.log
      - name: Test DiscoveryTests
        timeout-minutes: 6
        run: |
          set -o pipefail
          swift test -c release --filter DiscoveryTests 2>&1 | tee test-DiscoveryTests.log
      # DownloadsTests has wedged at the class level before; per-method
      # steps keep a hanging case visible in the step list.
      - name: Test DownloadsTests.testCancel
        timeout-minutes: 3
        run: |
          set -o pipefail
          swift test -c release --filter DownloadsTests.testCancel 2>&1 | tee test-DownloadsTests-testCancel.log
      - name: Test DownloadsTests.testConcurrentLimit
        timeout-minutes: 3
        run: |
          set -o pipefail
          swift test -c release --filter DownloadsTests.testConcurrentLimit 2>&1 | tee test-DownloadsTests-testConcurrentLimit.log
      - name: Test DownloadsTests.testDownloadErrorRetryable
        timeout-minutes: 3
        run: |
          set -o pipefail
          swift test -c release --filter DownloadsTests.testDownloadErrorRetryable 2>&1 | tee test-DownloadsTests-testDownloadErrorRetryable.log
      - name: Test DownloadsTests.testEnqueueAndAllTasks
        timeout-minutes: 3
        run: |
          set -o pipefail
          swift test -c release --filter DownloadsTests.testEnqueueAndAllTasks 2>&1 | tee test-DownloadsTests-testEnqueueAndAllTasks.log
      - name: Test DownloadsTests.testFormattedProgressAndBytes
        timeout-minutes: 3
        run: |
          set -o pipefail
          swift test -c release --filter DownloadsTests.testFormattedProgressAndBytes 2>&1 | tee test-DownloadsTests-testFormattedProgressAndBytes.log
      - name: Test DownloadsTests.testPauseAndResume
        timeout-minutes: 3
        run: |
          set -o pipefail
          swift test -c release --filter DownloadsTests.testPauseAndResume 2>&1 | tee test-DownloadsTests-testPauseAndResume.log
      - name: Test DownloadsTests.testPriorityOrdering
        timeout-minutes: 3
        run: |
          set -o pipefail
          swift test -c release --filter DownloadsTests.testPriorityOrdering 2>&1 | tee test-DownloadsTests-testPriorityOrdering.log
      - name: Test DownloadsTests.testRetryWithBackoff
        timeout-minutes: 3
        run: |
          set -o pipefail
          swift test -c release --filter DownloadsTests.testRetryWithBackoff 2>&1 | tee test-DownloadsTests-testRetryWithBackoff.log
      - name: Test DownloadsTests.testStateMachineTransitions
        timeout-minutes: 3
        run: |
          set -o pipefail
          swift test -c release --filter DownloadsTests.testStateMachineTransitions 2>&1 | tee test-DownloadsTests-testStateMachineTransitions.log
      - name: Test DownloadsTests.testStats
        timeout-minutes: 3
        run: |
          set -o pipefail
          swift test -c release --filter DownloadsTests.testStats 2>&1 | tee test-DownloadsTests-testStats.log
      - name: Test EventBusTests
        timeout-minutes: 6
        run: |
          set -o pipefail
          swift test -c release --filter EventBusTests 2>&1 | tee test-EventBusTests.log
      - name: Test LibraryDNATests
        timeout-minutes: 6
        run: |
          set -o pipefail
          swift test -c release --filter LibraryDNATests 2>&1 | tee test-LibraryDNATests.log
      - name: Test LibraryEngineTests
        timeout-minutes: 6
        run: |
          set -o pipefail
          swift test -c release --filter LibraryEngineTests 2>&1 | tee test-LibraryEngineTests.log
      - name: Test LyricsPlusTests
        timeout-minutes: 6
        run: |
          set -o pipefail
          swift test -c release --filter LyricsPlusTests 2>&1 | tee test-LyricsPlusTests.log
      - name: Test PlayerTests
        timeout-minutes: 6
        run: |
          set -o pipefail
          swift test -c release --filter PlayerTests 2>&1 | tee test-PlayerTests.log
      - name: Test PolishTests
        timeout-minutes: 6
        run: |
          set -o pipefail
          swift test -c release --filter PolishTests 2>&1 | tee test-PolishTests.log
      - name: Test SearchEngineTests
        timeout-minutes: 6
        run: |
          set -o pipefail
          swift test -c release --filter SearchEngineTests 2>&1 | tee test-SearchEngineTests.log
      - name: Upload Swift diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: swift-diagnostics-${{ github.sha }}
          path: |
            swift-build.log
            test-*.log
          if-no-files-found: ignore
          retention-days: 5

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: |
          set -o pipefail
          swiftlint lint 2>&1 | tee swiftlint.log
      - name: Upload SwiftLint diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: swiftlint-diagnostics-${{ github.sha }}
          path: swiftlint.log
          if-no-files-found: ignore
          retention-days: 5

  ios-build:
    name: iOS simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned simulator app
        run: |
          set -o pipefail
          xcodebuild -project Qeloryx.xcodeproj -scheme Qeloryx \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -quiet CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log
      - name: Surface compiler errors in check annotations
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          lines = Path("xcodebuild.log").read_text(errors="replace").splitlines()
          matches = [line for line in lines if re.search(r"\berror:", line)]
          for line in matches[:20]:
              escaped = line.replace("%", "%25").replace("\\r", "%0D").replace("\\n", "%0A")
              print(f"::error title=Xcode build diagnostic::{escaped}")
          if not matches:
              print("::error title=Xcode build failed::No compiler diagnostic line was found; inspect the uploaded xcodebuild log artifact.")
          PY
      - name: Upload Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xcode-diagnostics-${{ github.sha }}
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 5

  docs:
    name: Documentation sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify required docs and links
        run: |
          set -euo pipefail
          test -s README.md
          test -s CHANGELOG.md
          test -s Docs/BUILD_READINESS.md
          test -s Docs/RELEASE_FLOW.md
          test -s project.yml
          test -s Package.swift
          ! grep -R -nE 'TODO\(broken-link\)' README.md Docs
