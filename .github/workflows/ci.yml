name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'release/**', 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-package:
    name: Swift package build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select supported Xcode toolchain
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '16.4'
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build -v 2>&1 | tee swift-build.log
      - name: Test
        run: swift test --enable-code-coverage 2>&1 | tee swift-test.log
      - name: Upload Swift diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: swift-diagnostics-${{ github.sha }}
          path: |
            swift-build.log
            swift-test.log
          if-no-files-found: ignore
          retention-days: 5

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint 2>&1 | tee swiftlint.log
      - name: Upload SwiftLint diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: swiftlint-diagnostics-${{ github.sha }}
          path: swiftlint.log
          if-no-files-found: ignore
          retention-days: 5

  ios-build:
    name: iOS simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned simulator app
        run: |
          set -o pipefail
          xcodebuild -project Qeloryx.xcodeproj -scheme Qeloryx \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log
      - name: Upload Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: xcode-diagnostics-${{ github.sha }}
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 5

  docs:
    name: Documentation sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify required docs and links
        run: |
          set -euo pipefail
          test -s README.md
          test -s CHANGELOG.md
          test -s Docs/BUILD_READINESS.md
          test -s Docs/RELEASE_FLOW.md
          test -s project.yml
          test -s Package.swift
          ! grep -R -nE 'TODO\(broken-link\)' README.md Docs
