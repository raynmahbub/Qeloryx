name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'release/**', 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-package:
    name: Swift package build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test --enable-code-coverage

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict

  ios-build:
    name: iOS simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned simulator app
        run: >-
          xcodebuild -project Qeloryx.xcodeproj -scheme Qeloryx
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug CODE_SIGNING_ALLOWED=NO build

  docs:
    name: Documentation sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required docs and links
        run: |
          set -euo pipefail
          test -s README.md
          test -s CHANGELOG.md
          test -s Docs/BUILD_READINESS.md
          test -s Docs/RELEASE_FLOW.md
          test -s project.yml
          test -s Package.swift
          ! grep -R -nE 'TODO\(broken-link\)' README.md Docs
