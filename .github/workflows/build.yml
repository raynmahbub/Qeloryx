name: Development build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        type: choice
        options: [Debug, Release]
        default: Debug
  push:
    branches: [main, 'arena/**']
    paths:
      - 'App/**'
      - 'Core/**'
      - 'DesignSystem/**'
      - 'Features/**'
      - 'Platform/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'project.yml'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and archive simulator app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build app
        env:
          BUILD_CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
        run: |
          set -o pipefail
          xcodebuild -project Qeloryx.xcodeproj -scheme Qeloryx \
            -destination 'generic/platform=iOS Simulator' \
            -configuration "$BUILD_CONFIGURATION" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/${{ inputs.configuration || 'Debug' }}-iphonesimulator/Qeloryx.app"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Qeloryx-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Qeloryx-simulator-${{ github.sha }}
          path: Qeloryx-simulator.zip
          if-no-files-found: error
          retention-days: 14
