name: Qeloryx

options:
  bundleIdPrefix: com.qeloryx
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      DEBUG: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      DEBUG: NO

settingGroups:
  app:
    base:
      INFOPLIST_FILE: App/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.qeloryx.app
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      CODE_SIGN_STYLE: Automatic
      SWIFT_EMIT_LOC_STRINGS: YES
      LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks

targets:
  Qeloryx:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Core
      - path: Features
      - path: Platform
      - path: DesignSystem
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qeloryx.app
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - sdk: SwiftData.framework
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - sdk: CoreHaptics.framework
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework

  # Two test bundles with disjoint sources. Previously `QeloryxTests` globbed
  # all of `Tests`, which swept in `Tests/CoreTests` and compiled the same 19
  # test classes into both bundles. `QeloryxCoreTests` also declared no
  # dependency on the app target, so it could not link against the code under
  # test at all.
  QeloryxTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/DesignSystemTests
    settings:
      base:
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Qeloryx.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Qeloryx
    dependencies:
      - target: Qeloryx

  QeloryxCoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/CoreTests
    settings:
      base:
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Qeloryx.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Qeloryx
    dependencies:
      - target: Qeloryx

schemes:
  Qeloryx:
    build:
      targets:
        Qeloryx: all
        QeloryxTests: [test]
        QeloryxCoreTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-QeloryxPerformanceMonitoring": YES
    test:
      config: Debug
      targets:
        - QeloryxTests
        - QeloryxCoreTests
      gatherCoverageData: true
      coverageTargets:
        - Qeloryx
    archive:
      config: Release

  Qeloryx-Release:
    build:
      targets:
        Qeloryx: all
    run:
      config: Release
    archive:
      config: Release
