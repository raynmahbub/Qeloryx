name: Qeloryx

configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig

options:
  bundleIdPrefix: com.qeloryx
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settingGroups:
  app:
    base:
      INFOPLIST_FILE: Qeloryx/App/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.qeloryx.app
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      CODE_SIGN_STYLE: Automatic
      LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks

targets:
  Qeloryx:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # The whole app module: App, Models, Views, ViewModels, Services,
      # Platform, DesignSystem, Utilities and Resources (single-module build).
      - path: Qeloryx
        excludes:
          - "**/.gitkeep"
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qeloryx.app
        INFOPLIST_FILE: Qeloryx/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - sdk: SwiftData.framework
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - sdk: CoreHaptics.framework
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework

  # One unit-test bundle over the categorized QeloryxTests tree
  # (Unit / Integration / Service / ProviderContract / AudioEngine /
  # Persistence / Performance). Each folder compiles into the same host, so
  # every suite shares the app's single engine graph.
  QeloryxTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: QeloryxTests
    settings:
      base:
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Qeloryx.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Qeloryx
    dependencies:
      - target: Qeloryx

  QeloryxUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: QeloryxUITests
    settings:
      base:
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TEST_TARGET_NAME: Qeloryx
    dependencies:
      - target: Qeloryx

schemes:
  Qeloryx:
    build:
      targets:
        Qeloryx: all
        QeloryxTests: [test]
        QeloryxUITests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-QeloryxPerformanceMonitoring": YES
    test:
      config: Debug
      targets:
        - QeloryxTests
        - QeloryxUITests
      gatherCoverageData: true
      coverageTargets:
        - Qeloryx
    archive:
      config: Release

  Qeloryx-Release:
    build:
      targets:
        Qeloryx: all
    run:
      config: Release
    archive:
      config: Release
